spring.application.name=imageproc

# Database Connection - H2 for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Set higher limits for image uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=/home/lhuihong/projects/imageproc/uploads

# --- JWT ---
jwt.secret=VGhpc0lzQVN1cGVyU2VjdXJlMzJCeXRlcy1DaGFuZ2VNZSEhISEh
jwt.expiration-ms=3600000

# Server port for tests
server.port=8080

# Disable Spring Security for tests (or configure appropriately)
spring.security.user.name=test
spring.security.user.password=test
