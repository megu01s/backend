spring.application.name=imageproc

# Database Connection
spring.datasource.url=jdbc:mariadb://localhost:3306/imageproc_db
spring.datasource.username=image_user
spring.datasource.password=123123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Set higher limits for image uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=/home/lhuihong/projects/imageproc/uploads

